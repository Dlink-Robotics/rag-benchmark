name: Bug
description: Report a bug or incorrect behavior
title: "fix: "
labels: ["fix"]
body:
  - type: markdown
    attributes:
      value: |
        Use the [issue title convention](https://github.com/Dlink-Robotics/rag-benchmark/blob/main/docs/issue-title-convention.md).
        Keep the `fix:` prefix and complete the short description.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is wrong?
      placeholder: Recall at k is calculated incorrectly
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps that trigger the bug
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, model, or other relevant details
      placeholder: |
        - OS:
        - Python:
        - Relevant config:
    validations:
      required: false

  - type: dropdown
    id: roadmap-step
    attributes:
      label: Roadmap step
      description: Optional. The benchmark step this belongs to, numbered as in the README. Also add the matching step label.
      options:
        - "0 Goal and bar"
        - "1 Test material"
        - "2 System under test and baseline"
        - "3 Run and record"
        - "4 Score each stage"
        - "5 Isolate the faulty stage"
        - "6 Trust the measurement"
        - "7 Experiments and decision"
        - "8 Speed, fit on the target device, report"
    validations:
      required: false

  - type: input
    id: blocked-by
    attributes:
      label: Blocked by
      description: Optional. An issue number or an open decision. If filled in, also add the blocked label.
    validations:
      required: false
