name: CI
description: Change CI or automation workflows
title: "ci: "
labels: ["ci"]
body:
  - type: markdown
    attributes:
      value: |
        Use the [issue title convention](https://github.com/Dlink-Robotics/rag-benchmark/blob/main/docs/issue-title-convention.md).
        Keep the `ci:` prefix and complete the short description.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What CI or automation change is needed?
      placeholder: Add automated test workflow
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Details
      description: Workflows, triggers, jobs, or checks involved
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
    validations:
      required: true

  - type: dropdown
    id: roadmap-step
    attributes:
      label: Roadmap step
      description: Optional. The benchmark step this belongs to, numbered as in the README. Also add the matching step label.
      options:
        - "0 Goal and bar"
        - "1 Test material"
        - "2 System under test and baseline"
        - "3 Run and record"
        - "4 Score each stage"
        - "5 Isolate the faulty stage"
        - "6 Trust the measurement"
        - "7 Experiments and decision"
        - "8 Speed, fit on the target device, report"
    validations:
      required: false

  - type: input
    id: blocked-by
    attributes:
      label: Blocked by
      description: Optional. An issue number or an open decision. If filled in, also add the blocked label.
    validations:
      required: false
