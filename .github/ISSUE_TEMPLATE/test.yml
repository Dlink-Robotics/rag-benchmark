name: Test
description: Add or update tests
title: "test: "
labels: ["test"]
body:
  - type: markdown
    attributes:
      value: |
        Use the [issue title convention](https://github.com/Dlink-Robotics/rag-benchmark/blob/main/docs/issue-title-convention.md).
        Keep the `test:` prefix and complete the short description.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What tests should be added or updated?
      placeholder: Add retrieval evaluation tests
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Which code, metric, or stage is under test?
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
    validations:
      required: true
